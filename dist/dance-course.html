<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zero to Hero Salsa by DancerU</title>
  <style>
/* styles.css — native CSS only. Design tokens, responsive layout, a11y support. */

/* ---- Design tokens -------------------------------------------------------- */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efece6;
  --text: #1e1b18;
  --text-muted: #6b645c;
  --accent: #c2410c;          /* warm terracotta */
  --accent-2: #7c2d12;        /* deep terracotta (hero gradient) */
  --accent-contrast: #ffffff;
  --border: #e0dbd2;
  --focus-ring: #2563eb;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-8: 48px;

  --radius: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.08);

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --fs-sm: clamp(.8rem, .78rem + .1vw, .875rem);
  --fs-base: clamp(.95rem, .9rem + .2vw, 1.05rem);
  --fs-lg: clamp(1.1rem, 1rem + .5vw, 1.35rem);
  --fs-xl: clamp(1.4rem, 1.2rem + 1vw, 1.9rem);
  --fs-2xl: clamp(1.8rem, 1.4rem + 2vw, 2.6rem);
  --fs-3xl: clamp(2.2rem, 1.6rem + 3vw, 3.4rem);

  --maxw: 1100px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17140f;
    --surface: #211d17;
    --surface-2: #2b261e;
    --text: #f2ede4;
    --text-muted: #a89f92;
    --accent: #f97316;
    --accent-2: #9a3412;
    --accent-contrast: #1a1206;
    --border: #37312a;
    --focus-ring: #60a5fa;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.5);
  }
}

/* ---- Base ----------------------------------------------------------------- */
* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: var(--fs-base);
  line-height: 1.55;
}

a { color: inherit; }

:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 4px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  background: var(--accent);
  color: var(--accent-contrast);
  padding: var(--space-2) var(--space-4);
  z-index: 100;
  border-radius: 0 0 var(--radius) 0;
}
.skip-link:focus { left: 0; }

.noscript {
  margin: var(--space-5);
  padding: var(--space-4);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}

/* ---- Header / tabs -------------------------------------------------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}

.site-title {
  display: block;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--space-4) var(--space-5) var(--space-2);
  font-size: var(--fs-lg);
  font-weight: 700;
  text-decoration: none;
  letter-spacing: .2px;
}

.tabs {
  max-width: var(--maxw);
  margin: 0 auto;
}

.tab-list {
  display: flex;
  gap: var(--space-1);
  list-style: none;
  margin: 0;
  padding: 0 var(--space-5) var(--space-2);
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
}
.tab-list::-webkit-scrollbar { height: 6px; }
.tab-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.tab {
  display: inline-block;
  white-space: nowrap;
  padding: var(--space-2) var(--space-3);
  min-height: 44px;
  line-height: 28px;
  color: var(--text-muted);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  scroll-snap-align: start;
  transition: color .15s ease, border-color .15s ease;
}
.tab:hover { color: var(--text); }
.tab.is-active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

/* ---- View container ------------------------------------------------------- */
.view {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--space-5);
  outline: none;
}

/* ---- Landing: hero -------------------------------------------------------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: calc(var(--radius) * 1.5);
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #fff;
  padding: var(--space-8) var(--space-6);
  margin-bottom: var(--space-6);
  box-shadow: var(--shadow);
}
.hero::after {
  content: "";
  position: absolute;
  right: -60px;
  top: -60px;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
}
.hero::before {
  content: "";
  position: absolute;
  left: -40px;
  bottom: -80px;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
}
.hero-eyebrow {
  position: relative;
  font-size: var(--fs-sm);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  opacity: .9;
  margin-bottom: var(--space-3);
}
.hero h1 {
  position: relative;
  font-size: var(--fs-3xl);
  margin: 0 0 var(--space-4);
  line-height: 1.1;
}
.hero p {
  position: relative;
  font-size: var(--fs-lg);
  max-width: 58ch;
  margin: 0;
  opacity: .95;
}
.hero-stats {
  position: relative;
  display: flex;
  gap: var(--space-6);
  margin-top: var(--space-5);
  flex-wrap: wrap;
}
.hero-stat { display: flex; flex-direction: column; }
.hero-stat b { font-size: var(--fs-xl); }
.hero-stat span {
  font-size: var(--fs-sm);
  opacity: .85;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.section-heading { font-size: var(--fs-xl); margin: 0 0 var(--space-5); }

/* ---- Landing: rich cards -------------------------------------------------- */
.card-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-5);
}

.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-decoration: none;
  overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:hover,
.card:focus-visible {
  transform: translateY(-3px);
  border-color: var(--accent);
  box-shadow: 0 6px 12px rgba(0,0,0,.12), 0 16px 36px rgba(0,0,0,.16);
}
.card-poster {
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, var(--surface-2), var(--border));
  display: grid;
  place-items: center;
  position: relative;
}
.card-poster .play {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(194,65,12,.92);
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
}
.card-poster .play::after {
  content: "";
  border-style: solid;
  border-width: 10px 0 10px 16px;
  border-color: transparent transparent transparent #fff;
  margin-left: 3px;
}
.card-badge {
  position: absolute;
  top: var(--space-3);
  left: var(--space-3);
  background: var(--accent);
  color: var(--accent-contrast);
  font-size: var(--fs-sm);
  font-weight: 700;
  padding: var(--space-1) var(--space-3);
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.card-body {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  flex: 1;
}
.card-title { font-size: var(--fs-lg); font-weight: 600; margin: 0; }
.card-summary { color: var(--text-muted); margin: 0; flex: 1; }

/* ---- Chips (oval move-name tags) ------------------------------------------ */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin: 0;
  padding: 0;
  list-style: none;
}
.card-chips { margin-top: var(--space-2); }
.chip {
  font-size: var(--fs-sm);
  padding: 2px var(--space-3);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-muted);
  white-space: nowrap;
}

/* ---- Class page ----------------------------------------------------------- */
.class-title { font-size: var(--fs-xl); margin: 0 0 var(--space-2); }
.class-week {
  color: var(--accent);
  font-weight: 700;
}
.class-summary {
  color: var(--text-muted);
  max-width: 65ch;
  margin: 0 0 var(--space-5);
}
.class-chips { margin: 0 0 var(--space-5); }

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}

.video { margin: 0; }
.video-label {
  font-size: var(--fs-sm);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text-muted);
  margin-bottom: var(--space-2);
}
.video-frame {
  position: relative;
  aspect-ratio: 16 / 9;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.video-frame iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.video-placeholder {
  display: grid;
  place-items: center;
  text-align: center;
  border-style: dashed;
  color: var(--text-muted);
  font-size: var(--fs-sm);
  text-transform: uppercase;
  letter-spacing: .5px;
}
.video-link {
  display: grid;
  place-items: center;
  text-decoration: none;
  background-size: cover;
  background-position: center;
  color: #fff;
}
.video-link::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .38);
  transition: background .15s ease;
}
.video-link:hover::after,
.video-link:focus-visible::after {
  background: rgba(0, 0, 0, .22);
}
.video-play {
  position: relative;
  z-index: 1;
  font-size: 2.4rem;
  line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .6));
}
.video-link-label {
  position: relative;
  z-index: 1;
  margin-top: var(--space-2);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
}

/* ---- Moves ---------------------------------------------------------------- */
.moves-heading {
  font-size: var(--fs-lg);
  margin: 0 0 var(--space-4);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--border);
}
.move-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-4);
}
.move {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-3);
  padding: var(--space-4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.move-gif {
  width: 100%;
  max-width: 320px;
  border-radius: var(--radius);
  display: block;
}
.move-name { font-size: var(--fs-lg); margin: 0 0 var(--space-1); }
.move-kind {
  display: inline-block;
  margin-left: var(--space-2);
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: var(--fs-xs, 0.75rem);
  font-weight: 600;
  vertical-align: middle;
  text-transform: uppercase;
  letter-spacing: .4px;
}
.move-desc { margin: 0; color: var(--text-muted); }

/* ---- Responsive: tablet --------------------------------------------------- */
@media (min-width: 600px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .move { grid-template-columns: 320px 1fr; align-items: start; }
}

/* ---- Responsive: desktop -------------------------------------------------- */
@media (min-width: 960px) {
  .video-grid { grid-template-columns: 1fr 1fr; }
}

/* ---- Reduced motion ------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

</style>
</head>

        {
          name: "Side Basic",

  <script>
// app.js — hash router + render logic. Reads only window.COURSE; no other state.
(function () {
  "use strict";

  var COURSE = window.COURSE || { title: "Course", summary: "", classes: [] };
  var viewEl = document.getElementById("view");
  var tabListEl = document.getElementById("tab-list");

  // --- helpers ---------------------------------------------------------------

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // Accept a bare YouTube id or a full URL and return the 11-char video id, or "".
  function youtubeId(raw) {
    if (!raw) return "";
    var s = String(raw).trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
    var m = s.match(/(?:v=|\/embed\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : "";
  }

  function findClass(week) {
    var w = parseInt(week, 10);
    for (var i = 0; i < COURSE.classes.length; i++) {
      if (COURSE.classes[i].week === w) return COURSE.classes[i];
    }
    return null;
  }

  // --- render: video ---------------------------------------------------------

  function renderVideo(slot, cls) {
    var id = youtubeId(slot && slot.youtubeId);
    var label = esc((slot && slot.title) || "Video");
    if (!id) {
      return (
        '<figure class="video">' +
        '<figcaption class="video-label">' + label + "</figcaption>" +
        '<div class="video-frame video-placeholder" role="img" aria-label="' +
        esc("Week " + cls.week + " " + label.toLowerCase() + " video — coming soon") +
        '"><span>' + label + " video<br>coming soon</span></div>" +
        "</figure>"
      );
    }
    var title = esc("Week " + cls.week + " " + label.toLowerCase() + " video");

    // YouTube's IFrame player rejects embeds served from a file:// (null) origin
    // with error 150/153. When the page is opened as a portable file:// bundle,
    // fall back to a click-through thumbnail that opens the video on youtube.com.
    var origin = (window.location && window.location.protocol) || "";
    if (origin !== "http:" && origin !== "https:") {
      var watch = "https://www.youtube.com/watch?v=" + id;
      var poster = "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg";
      return (
        '<figure class="video">' +
        '<figcaption class="video-label">' + label + "</figcaption>" +
        '<a class="video-frame video-link" href="' + watch + '" target="_blank" rel="noopener" ' +
        'style="background-image:url(\'' + poster + '\')" ' +
        'title="' + title + ' — opens on YouTube">' +
        '<span class="video-play" aria-hidden="true">&#9658;</span>' +
        '<span class="video-link-label">Watch on YouTube</span></a>' +
        "</figure>"
      );
    }

    // Served over http(s): use YouTube's canonical share-embed form exactly.
    var src = "https://www.youtube.com/embed/" + id;
    return (
      '<figure class="video">' +
      '<figcaption class="video-label">' + label + "</figcaption>" +
      '<div class="video-frame"><iframe src="' + src + '" title="' + title +
      '" loading="lazy" frameborder="0" referrerpolicy="strict-origin-when-cross-origin"' +
      ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>' +
      "</figure>"
    );
  }

  // --- render: move ----------------------------------------------------------

  function renderMove(move) {
    var media = "";
    if (move.gifUrl) {
      media =
        '<img class="move-gif" src="' + esc(move.gifUrl) + '" alt="' +
        esc(move.name + " animation") + '" loading="lazy">';
    }
    var kind = move.kind
      ? '<span class="move-kind">' + esc(move.kind) + "</span>"
      : "";
    return (
      '<li class="move">' +
      media +
      '<div class="move-body">' +
      '<h3 class="move-name">' + esc(move.name) + kind + "</h3>" +
      '<p class="move-desc">' + esc(move.description) + "</p>" +
      "</div></li>"
    );
  }

  // --- render: views ---------------------------------------------------------

  function renderLanding() {
    var cards = COURSE.classes
      .map(function (c) {
        var chips = (c.moves || [])
          .slice(0, 4)
          .map(function (m) { return '<span class="chip">' + esc(m.name) + "</span>"; })
          .join("");
        return (
          '<a class="card" href="#/class/' + c.week + '">' +
          '<div class="card-poster">' +
          '<span class="card-badge">Week ' + c.week + "</span>" +
          '<span class="play" aria-hidden="true"></span>' +
          "</div>" +
          '<div class="card-body">' +
          '<h3 class="card-title">' + esc(c.title) + "</h3>" +
          '<p class="card-summary">' + esc(c.summary) + "</p>" +
          '<div class="chips card-chips">' + chips + "</div>" +
          "</div></a>"
        );
      })
      .join("");
    return (
      '<section class="hero">' +
      '<div class="hero-eyebrow">DancerU &middot; with Herman and Jules</div>' +
      "<h1>" + esc(COURSE.title) + "</h1>" +
      "<p>" + esc(COURSE.summary) + "</p>" +
      '<div class="hero-stats">' +
      '<div class="hero-stat"><b>' + COURSE.classes.length + "</b><span>Weeks</span></div>" +
      '<div class="hero-stat"><b>' + (COURSE.classes.length * 2) + "</b><span>Videos</span></div>" +
      '<div class="hero-stat"><b>Free</b><span>No sign-up</span></div>' +
      "</div></section>" +
      '<h2 class="section-heading">Browse the classes</h2>' +
      '<div class="card-grid">' + cards + "</div>"
    );
  }

  function renderClass(cls) {
    var videos =
      renderVideo(cls.videos && cls.videos.explanation, cls) +
      renderVideo(cls.videos && cls.videos.demo, cls);
    var moves = (cls.moves || []).map(renderMove).join("");
    var chips = (cls.moves || [])
      .map(function (m) { return '<li class="chip">' + esc(m.name) + "</li>"; })
      .join("");
    var chipRow = chips
      ? '<ul class="chips class-chips" aria-label="Moves covered this week">' + chips + "</ul>"
      : "";
    return (
      '<section class="class-page">' +
      '<h1 class="class-title"><span class="class-week">Week ' + cls.week +
      "</span> " + esc(cls.title) + "</h1>" +
      '<p class="class-summary">' + esc(cls.summary) + "</p>" +
      chipRow +
      '<div class="video-grid">' + videos + "</div>" +
      '<h2 class="moves-heading">Moves covered</h2>' +
      '<ul class="move-list">' + moves + "</ul>" +
      "</section>"
    );
  }

  // --- tabs ------------------------------------------------------------------

  function renderTabs(activeWeek) {
    var items = ['<li><a class="tab' + (activeWeek == null ? " is-active" : "") +
      '" href="#/"' + (activeWeek == null ? ' aria-current="page"' : "") +
      ">Summary</a></li>"];
    COURSE.classes.forEach(function (c) {
      var active = c.week === activeWeek;
      items.push(
        '<li><a class="tab' + (active ? " is-active" : "") + '" href="#/class/' +
        c.week + '"' + (active ? ' aria-current="page"' : "") +
        ">Week " + c.week + "</a></li>"
      );
    });
    tabListEl.innerHTML = items.join("");
  }

  // --- router ----------------------------------------------------------------

  function render() {
    var hash = window.location.hash || "#/";
    var m = hash.match(/^#\/class\/(\d+)/);
    if (m) {
      var cls = findClass(m[1]);
      if (cls) {
        viewEl.innerHTML = renderClass(cls);
        renderTabs(cls.week);
        viewEl.focus();
        return;
      }
    }
    viewEl.innerHTML = renderLanding();
    renderTabs(null);
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);
  if (document.readyState !== "loading") render();
})();

</script>
